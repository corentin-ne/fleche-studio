<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Sécurité : seuls nos propres fichiers (scripts, styles, polices) ; réseau limité au Wiktionnaire / Wikipédia -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://fr.wiktionary.org https://fr.wikipedia.org https://en.wiktionary.org https://en.wikipedia.org; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; media-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Flèche Studio</title>
  <meta name="theme-color" content="#07090d">
  <meta name="description" content="Flèche Studio : créateur de grilles de mots fléchés, croisés, mêlés et codés : vos mots, vos définitions, votre style. Export PNG, SVG, PDF. Tout reste dans votre navigateur.">
  <link rel="icon" href="icon.svg?v=5" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Flèche Studio">
  <!-- Aperçu des liens partagés (WhatsApp, Facebook, LinkedIn…) : __SITE__ = adresse du site, inscrite au déploiement -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Flèche Studio">
  <meta property="og:title" content="Flèche Studio : crée tes grilles de mots fléchés, croisés, mêlés et codés">
  <meta property="og:description" content="Tes mots, tes définitions, ton style. Prête à imprimer ou à partager, gratuit et sans compte.">
  <meta property="og:url" content="__SITE__">
  <meta property="og:image" content="__SITE__icons/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo de Flèche Studio et les quatre jeux : fléchés, croisés, mêlés, codés">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:locale:alternate" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Polices hébergées avec l'application (css/fonts.css) : la principale est demandée tout de suite -->
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- ?v=__BUILD__ : remplacé par l'empreinte du commit au déploiement (cache navigateur toujours à jour) -->
  <link rel="stylesheet" href="css/fonts.css?v=__BUILD__">
  <link rel="stylesheet" href="css/tokens.css?v=__BUILD__">
  <link rel="stylesheet" href="css/base.css?v=__BUILD__">
  <link rel="stylesheet" href="css/glass.css?v=__BUILD__">
  <link rel="stylesheet" href="css/components.css?v=__BUILD__">
  <link rel="stylesheet" href="css/app.css?v=__BUILD__">
  <link rel="stylesheet" href="css/panels.css?v=__BUILD__">
  <link rel="stylesheet" href="css/live.css?v=__BUILD__">
  <link rel="stylesheet" href="css/mobile.css?v=__BUILD__">
  <link rel="stylesheet" href="css/print.css?v=__BUILD__">
</head>
<body>
  <noscript><p class="boot-error" role="alert">Flèche Studio a besoin de JavaScript pour fonctionner : active-le dans ton navigateur, puis recharge la page. · Flèche Studio needs JavaScript: please enable it in your browser and reload the page.</p></noscript>
  <div class="bg-ambient" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar glass">
      <button class="brand" id="btn-home" type="button" title="Mes grilles (H)" aria-label="Tableau de bord : mes grilles">
        <span class="brand-mark" data-brand aria-hidden="true"></span>
        <span class="brand-text" translate="no"><strong>Flèche</strong><small>Studio</small></span>
      </button>
      <nav class="puzzle-tabs" id="puzzle-tabs" aria-label="Mes grilles"></nav>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-icon" id="btn-undo" title="Annuler (Ctrl+Z)" aria-label="Annuler la dernière action"><span data-icon="undo"></span></button>
        <button class="btn btn-ghost btn-icon" id="btn-redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir"><span data-icon="redo"></span></button>
        <button class="btn btn-ghost btn-icon only-puzzle" id="btn-share" hidden title="Partager un lien pour jouer" aria-label="Partager"><span data-icon="share"></span></button>
        <button class="btn btn-ghost btn-icon" id="btn-open" hidden title="Ouvrir un fichier (sauvegarde, liste de mots, Excel…)" aria-label="Ouvrir"><span data-icon="folder"></span></button>
        <button class="btn btn-ghost btn-icon only-puzzle" id="btn-save" hidden title="Sauvegarder toutes mes grilles" aria-label="Sauvegarder"><span data-icon="download"></span></button>
        <button class="btn btn-ghost btn-icon" id="btn-help" hidden title="Aide & raccourcis (?)" aria-label="Aide"><span data-icon="help"></span></button>
        <button class="btn btn-ghost lang-btn" id="btn-lang" title="Langue / Language" aria-label="Langue / Language" aria-haspopup="menu" aria-expanded="false"><span data-icon="globe"></span><b id="lang-code">FR</b></button>
        <button class="btn btn-ghost btn-icon" id="btn-theme" title="Thème clair / sombre" aria-label="Changer de thème"><span data-icon="contrast"></span></button>
        <button class="btn btn-ghost btn-icon" id="btn-more" title="Partager, ouvrir, sauvegarder, aide…" aria-label="Plus d'actions" aria-haspopup="menu" aria-expanded="false"><span data-icon="more"></span></button>
        <input type="file" id="file-open" accept=".json,.txt,.csv,.tsv,.xlsx,application/json,text/plain,text/csv,image/png,image/jpeg,image/webp" hidden>
      </div>
    </header>

    <main class="workspace">
      <section class="grid-card glass" aria-label="Grille">
        <div class="grid-head">
          <div class="grid-title">
            <h1 id="grid-name" title="Cliquer pour renommer">—</h1>
            <span class="grid-game" id="grid-game"></span>
            <div class="grid-stats" id="grid-stats"></div>
          </div>
          <div class="grid-tools">
            <div class="segmented page-switch" id="page-switch" aria-label="Pages" hidden></div>
            <div class="segmented" id="mode-switch" role="group" aria-label="Affichage">
              <button data-mode="solution" title="Voir les réponses"><span data-icon="eye"></span><span class="lbl">Solution</span></button>
              <button data-mode="blank" title="Grille à remplir"><span data-icon="eyeOff"></span><span class="lbl">Vierge</span></button>
              <button data-mode="play" title="Jouer (P)"><span data-icon="play"></span><span class="lbl">Jouer</span></button>
            </div>
            <div class="zoom">
              <button class="btn btn-sm btn-ghost" id="btn-fit" title="Ajuster à l'écran"><span data-icon="grid"></span></button>
              <input type="range" id="zoom" min="10" max="160" step="2" aria-label="Zoom" title="Zoom (Ctrl + molette)">
            </div>
            <button class="btn" id="btn-shuffle" title="Calculer une autre grille (M)"><span data-icon="shuffle"></span><span class="lbl">Mélanger</span></button>
            <button class="btn btn-primary" id="btn-export" title="Exporter (E)"><span data-icon="download"></span>Exporter</button>
          </div>
        </div>
        <div class="gen-bar" id="gen-bar" hidden>
          <div class="progress"><i id="gen-progress" style="width:0%"></i></div>
        </div>
        <div class="stale-bar" id="stale-bar" hidden>
          <span data-icon="info"></span>
          <span>Ta liste a changé depuis le dernier calcul.</span>
          <span class="spacer"></span>
          <button class="btn btn-sm btn-primary" data-regen><span data-icon="refresh"></span>Mettre à jour la grille</button>
        </div>
        <div class="play-bar" id="play-bar" hidden>
          <span class="play-time"><span data-icon="clock"></span><b id="play-time">0:00</b></span>
          <span class="muted small play-tip">Clique une case et tape · re-clic ou Espace : change de sens</span>
          <span class="spacer"></span>
          <button class="btn btn-sm btn-ghost" id="btn-hint"></button>
          <button class="btn btn-sm btn-ghost" id="btn-hint-word"><span data-icon="wand"></span>Mot</button>
          <button class="btn btn-sm" id="btn-check"><span data-icon="check"></span>Vérifier</button>
          <button class="btn btn-sm btn-ghost" id="btn-clear-play" title="Tout effacer"><span data-icon="refresh"></span></button>
        </div>
        <!-- Jeu : définition du mot en cours (indispensable sur téléphone, où les cases sont petites) -->
        <div class="play-clue" id="play-clue" hidden>
          <button class="btn btn-icon btn-ghost" id="clue-prev" title="Mot précédent" aria-label="Mot précédent"><span data-icon="chevronRight"></span></button>
          <button class="pc-text" id="clue-text" type="button" title="Changer de sens" aria-live="polite">Touche une case pour voir sa définition</button>
          <button class="btn btn-icon btn-ghost" id="clue-next" title="Mot suivant" aria-label="Mot suivant"><span data-icon="chevronRight"></span></button>
          <button class="btn btn-icon btn-primary only-kb" id="clue-done" title="Fermer le clavier" aria-label="Fermer le clavier"><span data-icon="check"></span></button>
        </div>
        <div class="grid-scroll" id="grid-scroll"></div>
      </section>

      <aside class="side glass" aria-label="Édition">
        <div class="tabs side-tabs" id="side-tabs" role="tablist">
          <button role="tab" aria-controls="side-body" data-tab="words" title="Mots (1)"><span data-icon="list"></span><span class="lbl">Mots</span> <span class="badge" id="count-words">0</span></button>
          <button role="tab" aria-controls="side-body" data-tab="diag" title="Définitions (2)"><span data-icon="edit"></span><span class="lbl">Défs</span> <span class="badge" id="count-diag">0</span></button>
          <button role="tab" aria-controls="side-body" data-tab="design" title="Design (3)"><span data-icon="palette"></span><span class="lbl">Design</span></button>
          <button role="tab" aria-controls="side-body" data-tab="decor" title="Décor (4)"><span data-icon="sticker"></span><span class="lbl">Décor</span> <span class="badge" id="count-decor" hidden></span></button>
          <button role="tab" aria-controls="side-body" data-tab="settings" title="Grille (5)"><span data-icon="sliders"></span><span class="lbl">Grille</span></button>
        </div>
        <div class="side-body" id="side-body" role="tabpanel"></div>
      </aside>
    </main>

    <section class="welcome-wrap" id="welcome" aria-label="Accueil"></section>

    <!-- Téléphone : navigation entre la grille et les panneaux d'édition -->
    <nav class="phone-nav glass" id="phone-nav" aria-label="Navigation"></nav>
  </div>

  <div class="drop-overlay" aria-hidden="true"><div><span data-icon="upload"></span><b>Dépose tes fichiers</b><small>Photos, listes de mots (Excel, CSV, TXT), sauvegardes</small></div></div>
  <div id="print-area" aria-hidden="true"></div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Tous les scripts, dans l'ordre : voir js/loader.js (liste unique, version de déploiement) -->
  <script src="js/loader.js?v=__BUILD__" data-entry="app"></script>
</body>
</html>
