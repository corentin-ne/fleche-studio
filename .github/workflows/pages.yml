# Vérifie puis publie Flèche Studio sur GitHub Pages à chaque push sur main.
#   1. check  : lint, types, tests du moteur et essai de l'application dans Chromium ;
#   2. build  : site assemblé (liste blanche) et version de déploiement inscrite dans les fichiers ;
#   3. deploy : mise en ligne, seulement si tout ce qui précède a réussi.
# Les pull requests passent aussi par « check » (sans publication).
name: Vérification et déploiement GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Droits minimaux : lecture du code, écriture sur Pages uniquement
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions épinglées par commit (une étiquette de version peut être déplacée, pas un SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Dépendances (versions figées par package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types (fichiers // @ts-check)
        run: npm run typecheck

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Tests et essai de l'application
        run: npm test

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assembler le site (liste blanche)
        run: |
          set -eu
          mkdir -p _site/fonts
          cp -r index.html sw.js manifest.webmanifest icon.svg css js _site/
          cp fonts/*.woff2 fonts/LICENSES.txt _site/fonts/
          # Version de déploiement : caches du navigateur et du service worker renouvelés à chaque mise en ligne
          build="${GITHUB_SHA::10}"
          sed -i "s/__BUILD__/${build}/g" _site/index.html _site/sw.js _site/js/loader.js
          if grep -rl "__BUILD__" _site; then echo "Version non inscrite"; exit 1; fi
          # Garde-fou : aucun fichier inattendu ne doit partir en ligne
          unexpected=$(find _site -type f ! -name '*.html' ! -name '*.js' ! -name '*.css' ! -name '*.svg' ! -name '*.webmanifest' ! -name '*.woff2' ! -path '_site/fonts/LICENSES.txt')
          if [ -n "$unexpected" ]; then echo "Fichiers inattendus : $unexpected"; exit 1; fi
          find _site -type f | sort

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
