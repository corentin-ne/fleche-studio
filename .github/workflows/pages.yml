# Vérifie puis publie Flèche Studio sur GitHub Pages à chaque push sur main.
#   1. check  : lint, types, tests du moteur et essai de l'application dans Chromium ;
#   2. build  : site assemblé (liste blanche) et version de déploiement inscrite dans les fichiers ;
#   3. deploy : mise en ligne, seulement si tout ce qui précède a réussi.
# Tout se fait sur main : pas de branches ni de pull requests, une seule exécution par push.
name: Vérification et déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimaux : lecture du code, écriture sur Pages uniquement
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Marge pour l'installation du navigateur (paquets système), parfois lente côté GitHub
    timeout-minutes: 30
    steps:
      # Actions épinglées par commit (une étiquette de version peut être déplacée, pas un SHA)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Dépendances (versions figées par package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types (fichiers // @ts-check)
        run: npm run typecheck

      # Chromium sans interface (headless shell) : téléchargement et dépendances plus légers
      - name: Navigateur de test
        timeout-minutes: 20
        run: npx playwright install --with-deps --only-shell chromium

      - name: Tests et essai de l'application
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Assembler le site (liste blanche)
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -eu
          mkdir -p _site/fonts _site/icons
          cp -r index.html sw.js manifest.webmanifest manifest.en.webmanifest icon.svg css js _site/
          cp icons/*.png _site/icons/
          cp fonts/*.woff2 fonts/LICENSES.txt _site/fonts/
          # Version de déploiement : caches du navigateur et du service worker renouvelés à chaque mise en ligne
          build="${GITHUB_SHA::10}"
          sed -i "s/__BUILD__/${build}/g" _site/index.html _site/sw.js _site/js/loader.js
          # Numéro de version et date de mise en ligne, affichés dans le menu « Plus »
          release=$(node -p "require('./package.json').version")
          sed -i "s/__RELEASE__/${release}/; s/__DEPLOYED__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" _site/js/loader.js
          if grep -rlE "__(BUILD|RELEASE|DEPLOYED)__" _site; then echo "Version non inscrite"; exit 1; fi
          # Adresse du site (aperçus des liens partagés : og:url, og:image)
          sed -i "s|__SITE__|${SITE%/}/|g" _site/index.html
          if grep -l "__SITE__" _site/index.html; then echo "Adresse du site non inscrite"; exit 1; fi
          # Garde-fou : aucun fichier inattendu ne doit partir en ligne
          unexpected=$(find _site -type f ! -name '*.html' ! -name '*.js' ! -name '*.css' ! -name '*.svg' ! -name '*.webmanifest' ! -name '*.woff2' ! -path '_site/icons/*.png' ! -path '_site/fonts/LICENSES.txt')
          if [ -n "$unexpected" ]; then echo "Fichiers inattendus : $unexpected"; exit 1; fi
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
